name: Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/housing-app/London-housing-analytics

            git pull origin main

            cat > .env <<EOF
            AWS_KEY_ID=${{ secrets.AWS_KEY_ID }}
            AWS_SECRET=${{ secrets.AWS_SECRET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_BUCKET=${{ secrets.AWS_BUCKET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            EOF

            docker compose up -d --build

            # Fail the deploy loudly if the running image's code expects
            # tables the current database doesn't have, instead of leaving
            # a page that crashes for the next visitor.
            docker compose run --rm --entrypoint "" app bash -c \
              "cd london_housing && pytest app/tests/test_schema_health.py -v"

            docker image prune -f
